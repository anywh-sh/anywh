name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Everything below is gated on what actually changed — relay/ and client/
  # have no shared code, and the e2e tier in particular builds the whole
  # Tauri app (native compile + a real WebKitGTK window under Xvfb), which is
  # too expensive to run on every PR regardless of what it touched.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relay:
              - 'relay/**'
            client:
              - 'client/**'
              # The client tier also guards that relay/src/theme.ts is still
              # byte-identical to its copy under client/src/lib/ (there's no
              # shared package for them to live in). Without this line, a
              # change to the relay's copy alone would skip the only job that
              # can notice the two drifting apart.
              - 'relay/src/theme.ts'
              # The installers are compile-time inputs to the client crate,
              # not loose scripts: relay_setup.rs `include_str!`s
              # install-relay.sh and infra/homebrew/app-install.sh, and its
              # tests exercise infra/lib.sh directly. Editing one of them
              # changes what the app ships, so it has to run the job that
              # builds and tests it.
              - 'install.sh'
              - 'install-relay.sh'
              - 'infra/**'

  relay:
    name: relay (unit + integration)
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    # Real incident (2026-09-13): a single failing assertion left a WebSocket
    # open, which hung this tier's `after` hook and then the whole
    # `node --test` process — with no ceiling here, the run sat burning a
    # runner for 30 minutes and would have gone to GitHub's 6h default, on a
    # job whose honest runtime is well under a minute. The per-test timeouts
    # in relay/package.json are the first line of defense; this is the one
    # that holds even when the test runner itself is what stopped making
    # progress.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: relay/package-lock.json
      # The embedded terminal integration test (terminalPanel.test.ts) spawns
      # a real tmux via node-pty — explicit, not assumed preinstalled on the
      # runner image, same reasoning as client-e2e's own system-deps step
      # below (apt reports "already the newest version" harmlessly if it
      # already was).
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - run: npm ci
        working-directory: relay
      - run: npm run build
        working-directory: relay
      - run: npm run test:all
        working-directory: relay

  client-unit:
    name: client (unit + UI integration)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm test
        working-directory: client

  client-e2e:
    name: client (e2e, real Tauri app)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    # The widest ceiling of the four on purpose: this is the only tier that
    # compiles the Tauri app from scratch, so a cold rust-cache is a
    # legitimately slow run, not a stuck one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: client/src-tauri
      - uses: actions/setup-go@v6
        with:
          go-version-file: client/tailnet-sidecar/go.mod
          cache-dependency-path: client/tailnet-sidecar/go.sum
      # tauri-build's build.rs (bundle.externalBin) fails
      # the whole cargo build if this binary isn't on disk yet — it isn't
      # committed (client/src-tauri/binaries/ is gitignored, one binary per
      # platform target triple). Only the Linux triple is built here since
      # this job only runs on ubuntu-latest today (same scope as the rest of
      # this e2e tier); a GOOS/GOARCH matrix is future work for whenever
      # client-e2e itself gains a Windows/macOS matrix.
      - name: Build the tailnet-sidecar Go binary
        run: |
          mkdir -p ../src-tauri/binaries
          go build -o ../src-tauri/binaries/tailnet-sidecar-x86_64-unknown-linux-gnu ./cmd/tailnet-sidecar
        working-directory: client/tailnet-sidecar
      # Same packages this tier needed installing by hand the first time it
      # was validated locally (2026-09-07, .anywh/skills/tests/SKILL.md) —
      # libasound2-dev (cpal) and libclang-dev (whisper-rs/bindgen) are easy
      # to forget since they're needed by the voice feature, not by e2e
      # itself, but the app doesn't compile on Linux without them either way.
      - name: Install Tauri Linux + audio/whisper build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libclang-dev \
            xvfb
      - run: npm ci
        working-directory: client
      - run: npm run build:e2e
        working-directory: client
      # The Rust unit tests (relay_setup.rs, tailnet_sidecar.rs) — here
      # rather than in client-unit because this is the job that already has
      # the toolchain, the system libraries and a warm target dir.
      - run: npm run test:rust
        working-directory: client
      - run: xvfb-run -a npm run test:e2e
        working-directory: client

  # The one job branch protection points at. Every other job above is gated on
  # paths-filter, so which of them even report on a given PR changes with what
  # it touched — naming them individually as required checks means the ruleset
  # has to be edited by hand every time a job is added or renamed, and a typo
  # there fails open (a required check that matches no job is simply never
  # waited on). This aggregates them instead: it always runs, and it fails if
  # anything it depends on failed or was cancelled. `skipped` is a pass on
  # purpose — that's paths-filter correctly deciding a tier had nothing to do.
  ci:
    name: ci
    needs: [changes, relay, client-unit, client-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "relay=${{ needs.relay.result }}"
          echo "client-unit=${{ needs.client-unit.result }}"
          echo "client-e2e=${{ needs.client-e2e.result }}"
          exit 1
