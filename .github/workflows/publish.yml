name: Publish

# Separate from release.yml on purpose: this only fires once a release is actually published —
# release.yml's checksums job is the only thing that flips draft->published,
# after every build leg has uploaded its assets — so this workflow only ever
# reads assets that already exist, never races the build matrix. Keeping it
# separate also keeps the tap-repo PAT out of reach of the (much larger,
# third-party-action-heavy) build workflow.
#
# Triggered by workflow_run, not `on: release: published` — the latter
# never fires here. release.yml's checksums job flips draft->published
# using the built-in GITHUB_TOKEN, and GitHub deliberately suppresses
# events triggered by GITHUB_TOKEN from starting other workflow runs (loop
# prevention). Confirmed live on v0.1.1 (2026-09-11): the release
# published fine, this workflow just never started. workflow_run doesn't
# have that restriction — it fires on the *workflow's* completion, which
# happens after the exact same draft-flip either way.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Manual replay for a tag whose workflow_run already fired and failed
  # (e.g. a transient Homebrew push failure) — re-running the Release
  # workflow would rebuild every platform for nothing just to retry this.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.1)"
        required: true

permissions:
  contents: read

jobs:
  # Docker isn't here yet — deferred: multi-profile-in-a-container needs
  # the relay decoupled from systemd
  # first, which is a real refactor to code the daily-used relay depends on
  # today, not just new code).
  homebrew:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # workflow_run's head_branch is the tag name for a tag-triggered
      # run (GitHub's own semantics, not anywh-specific) — there's no
      # release object on this event to read tag_name from directly.
      - name: Resolve the release tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      # Reads the release's own SHA256SUMS instead of recomputing anything —
      # same reasoning as release.yml's checksums job: the formula's sha256
      # has to match the exact bytes a `brew install` downloads, and the
      # only source of truth for that is the sum release.yml already
      # published for this tag.
      - name: Read the darwin-arm64 checksum for this release
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="${tag#v}"
          asset="anywh-relay-${version}-darwin-arm64.tar.gz"
          gh release download "$tag" --repo "${{ github.repository }}" \
            --pattern SHA256SUMS --output SHA256SUMS --clobber
          sha="$(grep " $asset\$" SHA256SUMS | cut -d' ' -f1)"
          if [ -z "$sha" ]; then
            echo "::error::no SHA256SUMS entry for $asset in $tag — did release.yml's build-relay job run for this release?"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: anywh-sh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # macOS only, and only Apple Silicon — release.yml's build-relay job
      # doesn't publish a darwin-x64 leg, so an Intel Mac
      # has no asset to point at yet.
      #
      # No `depends_on "node"`: the tarball this points at is a Node Single
      # Executable Application (relay/sea-build/build.mjs) with its own
      # runtime bundled in, not a script that needs one installed. A shared
      # "node" dependency has a sharp edge: `brew uninstall anywh-relay`
      # autoremoves Node along with it whenever Node was only ever pulled in
      # as this formula's dependency (not installed on request by the user
      # directly) — even if the user has since started relying on that same
      # Node for unrelated work. This template (and the formula it writes)
      # drifted out of sync with that once already: a release right after
      # the SEA switch landed still had this step writing the old
      # `depends_on "node"` / `relay/dist/server.js` shape, silently
      # overwriting a hand-edited formula that had already moved off it.
      - name: Write the formula
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/anywh-relay.rb <<RUBY
          class AnywhRelay < Formula
            desc "Headless relay that lets the anywh app talk to a local Claude Code CLI"
            homepage "https://anywh.sh"
            url "https://github.com/${REPO}/releases/download/v${VERSION}/anywh-relay-${VERSION}-darwin-arm64.tar.gz"
            sha256 "${SHA256}"
            license "Apache-2.0"

            depends_on arch: :arm64

            def install
              libexec.install Dir["*"]
            end

            # No \`depends_on "node"\`: this ships a Node Single Executable
            # Application (built by relay/sea-build/build.mjs) with the
            # runtime bundled in, not a script that needs one installed. A
            # shared "node" dependency has a sharp edge: \`brew uninstall
            # anywh-relay\` autoremoves Node along with it whenever Node was
            # only ever pulled in as this formula's dependency (not
            # installed on request by the user directly) — even if the user
            # has since started relying on that same Node for unrelated
            # work. Bundling the runtime instead means this formula's
            # presence has zero bearing on whether Node exists on the
            # machine at all.
            #
            # No systemd EnvironmentFile= equivalent here either — Homebrew's
            # service DSL has no such thing — so the "default" profile's
            # config comes in via RELAY_ENV_FILE, a plain environment
            # variable the SEA binary's own entrypoint
            # (relay/sea-build/sea-entry.cjs) applies itself. That
            # indirection exists because Node SEA doesn't process runtime
            # CLI flags the way a plain \`node\` invocation does: the
            # previous approach here, passing
            # \`--env-file-if-exists=...\` on the command line, is silently
            # ignored by a SEA binary.
            service do
              run [opt_libexec/"anywh-relay"]
              environment_variables RELAY_ENV_FILE: "#{Dir.home}/.config/anywh/env/default.env"
              working_dir opt_libexec
              keep_alive true
              log_path var/"log/anywh-relay.log"
              error_log_path var/"log/anywh-relay.error.log"
            end

            def caveats
              <<~CAVEATS
                Create the "default" profile once before starting the service:
                  #{opt_libexec}/infra/systemd/add-profile.sh default --mode dev --relay-host <this-machine's-tailscale-or-lan-ip>

                Then:
                  brew services start anywh-relay
              CAVEATS
            end

            test do
              assert_path_exists libexec/"anywh-relay"
            end
          end
          RUBY

      - name: Commit and push
        env:
          VERSION: ${{ steps.sha.outputs.version }}
        run: |
          cd tap
          git config user.name "anywh-release-bot"
          git config user.email "actions@github.com"
          git add Formula/anywh-relay.rb
          if git diff --cached --quiet; then
            echo "No formula changes for ${VERSION} (already up to date)."
            exit 0
          fi
          git commit -m "anywh-relay ${VERSION}"
          git push
