name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Gates the release on both workspaces having no known high/critical
  # vulnerability at tag time — deliberately not in pr.yml: a dependency can
  # grow a new CVE with zero code change here, which would fail PRs for
  # something unrelated to their diff. Scoping the check to release time
  # instead means it can only ever block a release (nothing ships with a
  # known-vulnerable dependency), never unrelated day-to-day work. Runs
  # before create-release so a failure here means no draft release — and no
  # spent build-matrix minutes — for a tag that shouldn't ship yet.
  audit:
    strategy:
      fail-fast: false
      matrix:
        workspace: [client, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.workspace }}
      # --omit=dev on purpose: this gate is about what ships to end users,
      # not about the tooling that only ever runs in CI/local dev. Without
      # it this would never go green — client's e2e stack (@wdio/tauri-service,
      # devDependency only) currently pulls extract-zip through
      # @puppeteer/browsers, and every extract-zip release ever published is
      # listed as vulnerable (GHSA-jmr9-qjv8-65gv / GHSA-7pqw-9j4j-h8q3),
      # so there is no version bump that clears it.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.workspace }}

  # A draft release is created once, up front, instead of letting each
  # platform job in the matrix below get-or-create it by tag: tauri-action
  # supports the latter, but four jobs starting within seconds of each other
  # race to create the same tag and can end up with duplicates. Passing this
  # job's releaseId into every matrix job sidesteps the race entirely — this
  # is the pattern tauri-action's own docs recommend for multi-OS releases.
  # Staying draft is temporary, not the end state: the checksums job below
  # publishes it once every platform's assets are in.
  create-release:
    needs: audit
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: create-release
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `anywh ${tag}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

      - uses: actions/checkout@v7

      # install.sh ships as a release asset, not only as a file on `main`,
      # because https://anywh.sh/install redirects to
      # releases/latest/download/install.sh. Serving the *released* script
      # rather than the branch means a bad commit on main can't reach a new
      # installer before it has been tagged, and a rollback is a re-tag
      # instead of a hotfix push. The checksums job below sums it like any
      # other asset, so `curl | sh` is verifiable end to end.
      - name: Upload the install script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" install.sh --repo "${{ github.repository }}" --clobber

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # sidecarTarget keys match client/scripts/build-sidecar.mjs's
          # TARGETS map — the same script npm run build:sidecar already uses
          # locally, just pointed at the target this runner (or, for the
          # macOS Intel leg, this runner cross-compiling) needs to produce.
          # Pinned, not `ubuntu-latest`: glibc is backward but not forward
          # compatible, so the oldest runner we build on sets the oldest
          # distro the .deb/AppImage can run on. `ubuntu-latest` (24.04,
          # glibc 2.39) produced a binary that dies on Debian 12 (2.36) and
          # Ubuntu 22.04 (2.35) with a bare `version GLIBC_2.39 not found`
          # — the two LTS releases a self-hosted user is most likely to be
          # on. 22.04 puts the floor at glibc 2.35 and covers both.
          #
          # This trades one expiry for another: runner images are retired
          # (20.04 already was), so when 22.04 goes the floor silently rises
          # again. The durable fix is building this leg in a container with
          # a pinned old base, which doesn't depend on a runner image at
          # all — validated locally against debian:12, not adopted here
          # because it is a larger change than the bug warrants today.
          - platform: ubuntu-22.04
            sidecarTarget: linux-x64
          - platform: windows-latest
            sidecarTarget: win32-x64
          - platform: macos-14
            sidecarTarget: darwin-arm64
            rustTarget: aarch64-apple-darwin
          # Cross-compiled from the same arm64 runner rather than a second
          # macos-13 (Intel) box — Xcode's clang is multi-arch out of the
          # box (`-arch x86_64`), and Cargo's `cc` crate passes that flag
          # automatically for this target, so whisper-rs/cpal's native C
          # builds cross-compile without extra setup. Unvalidated until this
          # job runs for real — macOS was never exercised in CI before this workflow.
          - platform: macos-14
            sidecarTarget: darwin-x64
            rustTarget: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: client/src-tauri

      - uses: actions/setup-go@v6
        with:
          go-version-file: client/tailnet-sidecar/go.mod
          cache-dependency-path: client/tailnet-sidecar/go.sum

      # Same packages pr.yml's client-e2e job installs, for the same reason:
      # cpal (voice) needs ALSA headers and whisper-rs's bindgen needs
      # libclang, neither of which ships on the bare ubuntu-latest image.
      - name: Install Tauri Linux + audio/whisper build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libclang-dev

      # whisper-rs's bindgen needs libclang too, and windows-latest doesn't
      # ship one either — unvalidated until this job runs for real (same
      # reasoning as the macOS comment above: only Linux had ever
      # built this app before this workflow existed).
      - name: Install libclang for whisper-rs bindgen (Windows)
        if: matrix.platform == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - run: npm ci
        working-directory: client

      # Must run before tauri-action: tauri-build's build.rs fails the whole
      # cargo build if bundle.externalBin's binary isn't on disk yet
      # (same reason pr.yml's client-e2e job builds it before `tauri build`).
      # Pure Go, CGO_ENABLED=0 — confirmed working cross-compiled from a
      # single Linux box for all five targets, so each runner producing its
      # own (or, on the macOS Intel leg, the other arch's) binary is exactly
      # what the script is for.
      - name: Build the tailnet-sidecar Go binary
        run: node scripts/build-sidecar.mjs --target ${{ matrix.sidecarTarget }}
        working-directory: client

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          args: ${{ matrix.rustTarget && format('--target {0}', matrix.rustTarget) || '' }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

  # Ships the relay as a tarball with node_modules already compiled — separate
  # from the client's `build` matrix above because it packages a Node
  # service, not a Tauri bundle, and needs a different platform set.
  # node-pty@1.1.0 only publishes darwin-*/win32-* prebuilds, not linux-*, so npm falls back to
  # node-gyp on both Linux legs — the one thing this job exists to do once
  # in CI so a bare `curl | sh` on a clean Linux box (Fase 3) never has to
  # compile anything itself.
  build-relay:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux-x64
          # Hosted arm64 Ubuntu runner, free for public repos same as the
          # x64 ones — no cross-compilation, node-gyp just runs natively.
          - platform: ubuntu-24.04-arm
            target: linux-arm64
          # No node-gyp toolchain needed here: node-pty already ships a
          # darwin-arm64 prebuild, so `npm ci` just downloads it.
          - platform: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install node-gyp build toolchain (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential

      - run: npm ci
        working-directory: relay

      - run: npm run build
        working-directory: relay

      # Linux ships dist/ + node_modules and leans on a Node the user
      # already has (install.sh's own prereq check requires it ahead of
      # time) — see the SEA step below for why macOS doesn't do the same.
      #
      # devDependencies (typescript, tsx, esbuild, postject, @types/*)
      # compiled dist/ already — the shipped tarball doesn't need the
      # compiler that produced it. node-pty survives: it's a dependency,
      # not a devDependency.
      - name: Prune devDependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: npm prune --omit=dev
        working-directory: relay

      # Staged into relay/ + infra/ subdirs (not flattened) so the tarball's
      # own layout matches the repo's — infra/systemd/install.sh resolves
      # RELAY_DIR as `../../relay` from its own location, and
      # add-profile.sh sources `../lib.sh`; shipping infra/ alongside relay/
      # in the same relative positions means both scripts work unmodified
      # straight out of the extracted tarball (install.sh, Fase 3).
      - name: Stage the relay + infra tree (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          mkdir -p stage/relay
          cp -a relay/dist relay/node_modules relay/package.json stage/relay/
          cp -a infra stage/infra

      # macOS ships a Node Single Executable Application instead of dist/ +
      # node_modules + a shared Node — see relay/sea-build/build.mjs's own
      # comment for why: a Homebrew `depends_on "node"` autoremoves Node on
      # `brew uninstall anywh-relay` whenever it was only ever pulled in as
      # this formula's dependency, even if the user has started relying on
      # it for unrelated work since. Bundling the runtime removes that
      # coupling entirely. Runs on a real macOS arm64 runner (this job's own
      # `macos-14` leg), so build.mjs's blob generation, injection and
      # ad-hoc codesign all happen on the actual target platform, not
      # cross-built.
      - name: Build the SEA binary (macOS)
        if: matrix.target == 'darwin-arm64'
        run: node sea-build/build.mjs --target ${{ matrix.target }}
        working-directory: relay

      # Already the flat, self-contained tree build.mjs assembles (binary +
      # scripts/ + infra/ + node_modules/node-pty) — nothing left to stage.
      - name: Stage the relay + infra tree (macOS)
        if: matrix.target == 'darwin-arm64'
        run: |
          mkdir -p stage
          cp -a relay/sea-build/dist/${{ matrix.target }}/. stage/

      # Two names, same content: the versioned one is what a Homebrew
      # formula pins url+sha256 to (formulas need a stable, reproducible
      # URL per release);
      # the unversioned one is what install.sh downloads via
      # GitHub's `releases/latest/download/<name>` redirect, which needs a
      # fixed filename to avoid a GitHub API call (and a jq dependency) in
      # a shell script meant to run on a bare box.
      - name: Package and upload the tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          versioned="anywh-relay-${version}-${{ matrix.target }}.tar.gz"
          latest="anywh-relay-${{ matrix.target }}.tar.gz"
          tar czf "$versioned" -C stage $(ls stage)
          cp "$versioned" "$latest"
          gh release upload "${GITHUB_REF_NAME}" "$versioned" "$latest" \
            --repo "${{ github.repository }}" --clobber

  # Runs after every platform has uploaded its assets to the same draft
  # release, so the sums cover the exact files a downloader will get —
  # generating this was fabricated by hand once already, this keeps it from happening again.
  # Also the only place that flips the release out of draft: publishing from
  # inside the `build`/`build-relay` matrices would make the release
  # publicly visible as soon as the fastest leg finished, minutes before the
  # slowest one (Windows, ~4x slower than macOS arm64 in the dry run) had
  # uploaded its assets — a downloader in that window would find a release
  # missing most of its installers.
  checksums:
    needs: [create-release, build, build-relay]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release download "$tag" --repo "${{ github.repository }}" --dir dist --skip-existing
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release upload "$tag" dist/SHA256SUMS --repo "${{ github.repository }}" --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --draft=false
