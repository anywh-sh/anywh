name: Test install.sh

# Exercises the full curl | sh path on disposable runners instead of a real
# machine — same reasoning as anywh-sh/homebrew-tap's test.yml.
# install.sh's --apply step registers a real systemd user service and
# runs `loginctl enable-linger` — exactly what this repo's own CLAUDE.md
# says never to do on the author's dev machine without confirmation (the
# session reading this file might be a child process of one of those
# services already). A GitHub-hosted runner has no such history to break,
# and is destroyed after the job either way.
#
# Two ways in. After a Release, against the assets that release actually
# published — the end-to-end proof that `curl | sh` works for a stranger.
# On a pull request that touches the installer, against a tarball built
# from the checkout and served from localhost (ANYWH_RELEASE_BASE_URL): a
# change to install.sh or infra/ used to reach a tag with no test having
# run against it, because this workflow only ever fired after the tag.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  pull_request:
    paths:
      - install.sh
      - install-relay.sh
      - infra/**
      - .github/workflows/test-install.yml
  workflow_dispatch:

jobs:
  released:
    name: released assets (Linux)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Stub a logged-in agent CLI
        run: |
          sudo tee /usr/local/bin/claude > /dev/null <<'STUB'
          #!/bin/sh
          [ "$1" = "auth" ] && echo '{"loggedIn":true,"email":"stub@example.test"}'
          exit 0
          STUB
          sudo chmod +x /usr/local/bin/claude
      - name: Install from the published release and provision "default" in one run
        run: |
          ./install.sh --porcelain --profile-id default --relay-host 127.0.0.1 | tee install.log
          grep -q '^ANYWH done ok ' install.log
      - name: Confirm the relay is running and listening
        run: |
          port="$(grep '^RELAY_PORT=' "$HOME/.config/anywh/env/default.env" | cut -d= -f2)"
          for _ in $(seq 1 15); do nc -z localhost "$port" && break; sleep 1; done
          if ! nc -z localhost "$port"; then
            echo "::error::relay never opened port $port"
            systemctl --user status anywh-relay@default --no-pager || true
            journalctl --user -u anywh-relay@default --no-pager || true
            exit 1
          fi
      - name: Stop the service
        if: always()
        run: systemctl --user stop anywh-relay@default || true

  checkout-linux:
    name: checkout tarball (Linux, real systemd)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANYWH_RELEASE_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: relay/package-lock.json

      # Every other step here runs `./install.sh`, which respects the
      # shebang and always executes under bash — the documented one-liner
      # (`curl | sh`) doesn't: piped to `sh`, the shebang is just a comment,
      # and the script runs under whatever /bin/sh actually is, dash on this
      # exact runner image. Regression for a `set -euo pipefail` that dash
      # rejected outright before the script did anything (`pipefail` is a
      # bash/ksh extension), caught only by hand against a real Debian box
      # because nothing here had ever run the script this way.
      - name: Runs under the documented "curl | sh" invocation (dash, not bash)
        run: |
          readlink -f /bin/sh | grep -q dash
          sh ./install.sh --help > /dev/null

      # Same staging release.yml's build-relay job does, minus the upload:
      # the tarball under test carries *this* checkout's infra/, which is
      # the whole point of running on a pull request.
      - name: Build the relay tarball from the checkout
        run: |
          (cd relay && npm ci && npm run build && npm prune --omit=dev)
          mkdir -p stage/relay serve
          cp -a relay/dist relay/node_modules relay/package.json stage/relay/
          cp -a infra stage/infra
          tar czf serve/anywh-relay-linux-x64.tar.gz -C stage relay infra
          # An archive that is valid gzip/tar but has no relay in it — what a
          # truncated or wrong-asset download looks like once it passes the
          # checksum. Named as a pinned version so a run can pick it.
          mkdir -p broken/relay
          echo "not a relay" > broken/relay/README
          tar czf serve/anywh-relay-0.0.0-broken-linux-x64.tar.gz -C broken relay
          # The relay half of the installer is a release asset too — it is
          # what install.sh downloads and checksums when it has no sibling
          # copy beside it, which is every `curl | sh`.
          cp install-relay.sh serve/
          (cd serve && sha256sum -- * > SHA256SUMS)
          (cd serve && python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/SHA256SUMS > /dev/null && break; sleep 0.5; done

      - name: Stub a logged-in agent CLI
        run: |
          sudo tee /usr/local/bin/claude > /dev/null <<'STUB'
          #!/bin/sh
          [ "$1" = "auth" ] && echo "${FAKE_AUTH_JSON:-{\"loggedIn\":true,\"email\":\"stub@example.test\"}}"
          exit 0
          STUB
          sudo chmod +x /usr/local/bin/claude

      # What a piped `curl | sh` actually does, which no other step here
      # covers: install.sh copied somewhere with no install-relay.sh beside
      # it, so the only way it can do anything is to download that half and
      # verify it. Every other step runs the dispatcher out of the checkout,
      # where the sibling shortcut means the download path is never touched.
      - name: The front door downloads the relay half when it stands alone
        run: |
          mkdir -p "$RUNNER_TEMP/alone"
          cp install.sh "$RUNNER_TEMP/alone/"
          ANYWH_INSTALL_DIR="$RUNNER_TEMP/alone-install" \
            sh "$RUNNER_TEMP/alone/install.sh" --porcelain --relay-only --mode dev > out.log 2>&1
          cat out.log
          grep -q '^ANYWH done ok ' out.log
          [ -f "$RUNNER_TEMP/alone-install/relay/dist/server.js" ]

      # The trust boundary the split introduces: install.sh fetches a script
      # and runs it as this user, so it verifies those bytes the same way
      # install-relay.sh verifies the tarball. Same step proves the
      # precedence rule the whole suite leans on — a sibling copy always
      # wins over the network, so the checkout's own script is what runs
      # even while the served one is poisoned.
      - name: A tampered relay half is refused, and a sibling is preferred to it
        run: |
          cp serve/install-relay.sh "$RUNNER_TEMP/install-relay.sh.orig"
          echo "# tampered" >> serve/install-relay.sh
          set +e
          sh "$RUNNER_TEMP/alone/install.sh" --relay-only --mode dev > out.log 2>&1
          status=$?
          set -e
          cat out.log
          [ "$status" -ne 0 ]
          grep -q 'checksum mismatch for install-relay.sh' out.log
          ANYWH_INSTALL_DIR="$RUNNER_TEMP/sibling-wins" \
            ./install.sh --porcelain --relay-only --mode dev > sibling.log 2>&1
          cat sibling.log
          grep -q '^ANYWH done ok ' sibling.log
          cp "$RUNNER_TEMP/install-relay.sh.orig" serve/install-relay.sh

      # Deliberately not fatal, and this is the step that says so. A relay
      # installs, starts and serves with no usable agent CLI, and resolves
      # the binary when a turn spawns it — so one installed or logged into
      # after this ran needs nothing re-run. No profile flags and --mode
      # dev on both: they assert on the prerequisites step, and provisioning
      # anything would land in the shared ~/.config/anywh/env that the
      # idempotency step below counts.
      - name: A logged-out agent is reported, not fatal
        run: |
          FAKE_AUTH_JSON='{"loggedIn":false}' ANYWH_INSTALL_DIR="$RUNNER_TEMP/logged-out" \
            ./install.sh --porcelain --mode dev > out.log 2>&1
          cat out.log
          grep -q "^ANYWH done prereqs .*agent_ready=0" out.log
          grep -q "warning: 'claude' isn't logged in" out.log
          grep -q '^ANYWH done ok ' out.log
          [ -f "$RUNNER_TEMP/logged-out/relay/dist/server.js" ]

      - name: No agent CLI on the machine at all is reported, not fatal
        run: |
          AGENT_BIN=no-such-agent-cli ANYWH_INSTALL_DIR="$RUNNER_TEMP/no-agent" \
            ./install.sh --porcelain --mode dev > out.log 2>&1
          cat out.log
          grep -q "^ANYWH done prereqs .*agent=no-such-agent-cli agent_ready=0" out.log
          grep -q "warning: the 'no-such-agent-cli' CLI was not found on PATH" out.log
          grep -q '^ANYWH done ok ' out.log
          [ -f "$RUNNER_TEMP/no-agent/relay/dist/server.js" ]

      - name: Flags are validated before any network
        run: |
          set +e
          ANYWH_RELEASE_BASE_URL=http://127.0.0.1:1 ./install.sh --porcelain --profile-id 'Bad Id' --relay-host 10.0.0.1 > out.log 2>&1
          status=$?
          set -e
          [ "$status" -ne 0 ]
          grep -q '^ANYWH fail flags bad_flag ' out.log
          set +e
          ANYWH_RELEASE_BASE_URL=http://127.0.0.1:1 ./install.sh --porcelain --profile-id ok > out.log 2>&1
          status=$?
          set -e
          [ "$status" -ne 0 ]
          grep -q '^ANYWH fail flags bad_flag --relay-host is required' out.log

      - name: Install and provision "default" in one run
        run: |
          ./install.sh --porcelain --profile-id default --profile-label "Default" --relay-host 127.0.0.1 | tee install.log
          grep -q '^ANYWH done ok service=systemd' install.log
          grep -q '^ANYWH profile id=default port=[0-9]* host=127.0.0.1 mode=prod' install.log
          [ -f "$HOME/.local/share/anywh/relay/dist/server.js" ]
          ls -d "$HOME/.local/share/anywh"/.staging.* "$HOME/.local/share/anywh"/*.old.* 2>/dev/null && exit 1 || true

      - name: Confirm the relay is running and listening
        run: |
          port="$(grep '^RELAY_PORT=' "$HOME/.config/anywh/env/default.env" | cut -d= -f2)"
          for _ in $(seq 1 15); do nc -z localhost "$port" && break; sleep 1; done
          if ! nc -z localhost "$port"; then
            echo "::error::relay never opened port $port"
            systemctl --user status anywh-relay@default --no-pager || true
            journalctl --user -u anywh-relay@default --no-pager || true
            exit 1
          fi

      - name: Re-running is idempotent — no duplicate entry, no restart
        run: |
          before="$(systemctl --user show -p ActiveEnterTimestampMonotonic --value anywh-relay@default)"
          ./install.sh --porcelain --profile-id default --profile-label "Default" --relay-host 127.0.0.1 | tee rerun.log
          grep -q '^ANYWH done ok ' rerun.log
          after="$(systemctl --user show -p ActiveEnterTimestampMonotonic --value anywh-relay@default)"
          [ "$before" = "$after" ] || { echo "::error::the re-run restarted the unit"; exit 1; }
          [ "$(ls "$HOME/.config/anywh/env"/*.env | wc -l)" -eq 1 ]
          [ "$(node -p 'require(process.argv[1]).profiles.filter(p => p.id === "default").length' "$HOME/.config/anywh/profiles.json")" -eq 1 ]

      - name: A different --relay-host for an existing profile is refused, with the difference named
        run: |
          set +e
          "$HOME/.local/share/anywh/infra/systemd/add-profile.sh" default --relay-host 10.9.9.9 --resume --porcelain > out.log 2>&1
          status=$?
          set -e
          cat out.log
          [ "$status" -ne 0 ]
          grep -q '^ANYWH fail profile resume_mismatch ' out.log
          grep -q 'RELAY_HOST: have 127.0.0.1, want 10.9.9.9' out.log

      - name: A profile left half-provisioned resumes with a single .env
        run: |
          add="$HOME/.local/share/anywh/infra/systemd/add-profile.sh"
          # Masking the instance makes `enable --now` fail *after* the .env
          # and profiles.json are written — the state a death at the last
          # step leaves behind.
          systemctl --user mask anywh-relay@partial
          set +e
          "$add" partial --relay-host 127.0.0.1 > out.log 2>&1
          status=$?
          set -e
          [ "$status" -ne 0 ]
          [ -f "$HOME/.config/anywh/env/partial.env" ]
          systemctl --user unmask anywh-relay@partial
          set +e
          "$add" partial --relay-host 127.0.0.1 > out.log 2>&1
          set -e
          grep -q "already exists" out.log
          "$add" partial --relay-host 127.0.0.1 --resume --porcelain | tee resume.log
          grep -q '^ANYWH profile id=partial ' resume.log
          [ "$(ls "$HOME/.config/anywh/env"/partial*.env | wc -l)" -eq 1 ]
          systemctl --user is-active --quiet anywh-relay@partial

      - name: The id is derived from the label when none is given
        run: |
          ./install.sh --porcelain --profile-label "Ana's Studio Box" --relay-host 127.0.0.1 --mode dev | tee slug.log
          grep -q '^ANYWH profile id=ana-s-studio-box port=[0-9]* host=127.0.0.1 mode=dev' slug.log
          [ -f "$HOME/.config/anywh/env/ana-s-studio-box.env" ]

      - name: --relay-host auto never lands on loopback
        run: |
          "$HOME/.local/share/anywh/infra/systemd/add-profile.sh" --help > /dev/null
          ./install.sh --porcelain --profile-id auto-picked --relay-host auto --mode dev | tee auto.log
          host="$(sed -n 's/^ANYWH done relay_host host=//p' auto.log)"
          echo "picked $host"
          [ -n "$host" ]
          case "$host" in 127.*) echo "::error::auto picked loopback"; exit 1 ;; esac
          grep -q "^RELAY_HOST=$host\$" "$HOME/.config/anywh/env/auto-picked.env"

      - name: A broken tarball never replaces a working install
        run: |
          echo sentinel > "$HOME/.local/share/anywh/relay/SENTINEL"
          set +e
          ./install.sh --porcelain --version 0.0.0-broken > out.log 2>&1
          status=$?
          set -e
          cat out.log
          [ "$status" -ne 0 ]
          grep -q '^ANYWH fail install tarball_incomplete ' out.log
          [ -f "$HOME/.local/share/anywh/relay/SENTINEL" ]
          [ -f "$HOME/.local/share/anywh/relay/dist/server.js" ]
          ls -d "$HOME/.local/share/anywh"/.staging.* 2>/dev/null && exit 1 || true
          systemctl --user is-active --quiet anywh-relay@default

      - name: Stop the services
        if: always()
        run: |
          systemctl --user stop anywh-relay@default || true
          systemctl --user stop anywh-relay@partial || true

  checkout-macos:
    name: checkout tarball (macOS, no service manager)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 20
    env:
      ANYWH_RELEASE_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Build the relay tarball from the checkout
        run: |
          (cd relay && npm ci && npm run build && npm prune --omit=dev)
          mkdir -p stage/relay serve
          cp -a relay/dist relay/node_modules relay/package.json stage/relay/
          cp -a infra stage/infra
          tar czf serve/anywh-relay-darwin-arm64.tar.gz -C stage relay infra
          (cd serve && shasum -a 256 -- * > SHA256SUMS)
          (cd serve && python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/SHA256SUMS > /dev/null && break; sleep 0.5; done
      - name: Stub a logged-in agent CLI
        run: |
          sudo tee /usr/local/bin/claude > /dev/null <<'STUB'
          #!/bin/sh
          [ "$1" = "auth" ] && echo '{"loggedIn":true}'
          exit 0
          STUB
          sudo chmod +x /usr/local/bin/claude
      # Regression for the darwin leg that used to die inside the systemd
      # step *after* extracting: exits 0, whole tree, no service, and the
      # profile lands in dev mode since there is nothing to enable it in.
      - name: Installs the tree, skips the service, exits 0
        run: |
          ./install.sh --porcelain --profile-id default --relay-host 10.0.0.5 | tee install.log
          grep -q '^ANYWH done service manager=none' install.log
          grep -q '^ANYWH profile id=default port=[0-9]* host=10.0.0.5 mode=dev' install.log
          grep -q '^ANYWH done ok service=none' install.log
          grep -q 'brew install anywh-sh/tap/anywh-relay' install.log
          [ -f "$HOME/.local/share/anywh/relay/dist/server.js" ]
          [ -f "$HOME/.local/share/anywh/infra/systemd/add-profile.sh" ]
          ls -d "$HOME/.local/share/anywh"/.staging.* 2>/dev/null && exit 1 || true
          grep -q '^RELAY_HOST=10.0.0.5$' "$HOME/.config/anywh/env/default.env"

  # The app half, against fixture bundles rather than a real build. What is
  # under test is the installer's mechanics — resolve the asset for this
  # platform, verify it, place it, write a launcher, open it — none of which
  # depend on the bundle being a real Tauri app, and all of which would sit
  # behind a ten-minute native compile if it were. The real bundle is what
  # release.yml builds and what the client-e2e tier drives.
  app-linux:
    name: app install (Linux, fixture bundles)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Pinned rather than `ubuntu-latest` for the same reason release.yml's
    # Linux leg is: this is the distro the AppImage is built against. It also
    # keeps `libfuse2` installable under that name — 24.04 renamed it, and
    # the mount branch below needs it present to be exercised at all.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ANYWH_RELEASE_BASE_URL: http://127.0.0.1:8791
    steps:
      - uses: actions/checkout@v7

      # libfuse2 is not decoration: without it every run here would take
      # the unpack fallback and the mount branch — the one a desktop with
      # FUSE actually takes — would never be asserted on. Installed
      # explicitly rather than assumed from the runner image, so the branch
      # a given run exercises is a property of this file and not of whatever
      # GitHub last baked in.
      - name: Install libfuse2 and desktop-file-validate
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 desktop-file-utils

      - name: Serve fixture release assets
        run: |
          mkdir -p serve "$RUNNER_TEMP/bin"
          # A real binary copied to the name the app runs under, so the
          # installer's `pgrep -x anywh` check has something truthful to
          # find — a shell script would show up as its interpreter.
          cp /bin/sleep "$RUNNER_TEMP/bin/anywh"
          cat > serve/anywh-linux-x64.AppImage <<FIXTURE
          #!/bin/sh
          if [ "\${1:-}" = "--appimage-extract" ]; then
            mkdir -p squashfs-root
            printf '#!/bin/sh\nexec $RUNNER_TEMP/bin/anywh 120\n' > squashfs-root/AppRun
            chmod +x squashfs-root/AppRun
            exit 0
          fi
          exec $RUNNER_TEMP/bin/anywh 120
          FIXTURE
          chmod +x serve/anywh-linux-x64.AppImage
          printf 'fixture icon\n' > serve/anywh-icon.png
          printf '#!/bin/sh\necho "relay installer ran: $*"\n' > serve/install-relay.sh
          (cd serve && sha256sum -- * > SHA256SUMS)
          (cd serve && python3 -m http.server 8791 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8791/SHA256SUMS > /dev/null && break; sleep 0.5; done
          # install.sh with no sibling install-relay.sh beside it, so the
          # relay route has to go through the download path and no real
          # relay is needed to assert on routing.
          mkdir -p "$RUNNER_TEMP/alone"
          cp install.sh "$RUNNER_TEMP/alone/"

      # The routing decision itself, in both directions. A GitHub runner has
      # no display, which makes it the honest environment for the half of
      # this that matters: a box with no graphical session must not be given
      # an app it cannot show.
      - name: With no display it installs the relay, and says so
        run: |
          [ -z "${DISPLAY:-}" ]
          sh "$RUNNER_TEMP/alone/install.sh" > out.log 2>&1
          cat out.log
          grep -q 'No graphical session detected' out.log
          grep -q 'relay installer ran:' out.log
          [ ! -e "$HOME/.local/share/anywh/app" ]

      - name: With a display it installs the app, silently about routing
        run: |
          DISPLAY=:99 sh "$RUNNER_TEMP/alone/install.sh" --no-launch > out.log 2>&1
          cat out.log
          grep -q 'No graphical session detected' out.log && exit 1 || true
          grep -q 'relay installer ran:' out.log && exit 1 || true
          [ -x "$HOME/.local/share/anywh/app/anywh.AppImage" ]
          [ -f "$HOME/.local/share/icons/hicolor/256x256/apps/anywh.png" ]
          desktop-file-validate "$HOME/.local/share/applications/sh.anywh.client.desktop"
          grep -q "^Exec=$HOME/.local/share/anywh/app/anywh.AppImage %U\$" "$HOME/.local/share/applications/sh.anywh.client.desktop"
          grep -q "^Icon=$HOME/.local/share/icons/" "$HOME/.local/share/applications/sh.anywh.client.desktop"
          [ "$(readlink "$HOME/.local/bin/anywh")" = "$HOME/.local/share/anywh/app/anywh.AppImage" ]

      # The marker is what the in-app updater (Fase A2) trusts to decide
      # whether it's even allowed to offer a self-update — a fixture server
      # with no redirect never resolves `installedVersion`, so this only
      # pins the two fields that matter here: it exists, parses, and the
      # writer picked the channel this branch actually took (mounted
      # AppImage, since libfuse2 is installed on this runner).
      - name: Writes an install-source marker for the mounted AppImage
        run: |
          marker="$HOME/.local/share/anywh/app/install-source.json"
          [ -f "$marker" ]
          python3 -c "
          import json
          d = json.load(open('$marker'))
          assert d['version'] == 1, d
          assert d['method'] == 'install.sh', d
          assert d['channel'] == 'appimage', d
          assert d['path'] == '$HOME/.local/share/anywh/app/anywh.AppImage', d
          "

      # Ubuntu runners still ship libfuse2, so the branch most users on a
      # current desktop will take would never run here without being asked
      # for by name.
      - name: Without libfuse2 it unpacks the AppImage and launches AppRun
        run: |
          ANYWH_APPIMAGE_NO_FUSE=1 DISPLAY=:99 sh "$RUNNER_TEMP/alone/install.sh" --app --no-launch > out.log 2>&1
          cat out.log
          grep -q "libfuse2 isn't installed" out.log
          [ -x "$HOME/.local/share/anywh/app/anywh.AppDir/AppRun" ]
          grep -q "^Exec=$HOME/.local/share/anywh/app/anywh.AppDir/AppRun %U\$" "$HOME/.local/share/applications/sh.anywh.client.desktop"
          [ "$(readlink "$HOME/.local/bin/anywh")" = "$HOME/.local/share/anywh/app/anywh.AppDir/AppRun" ]
          marker="$HOME/.local/share/anywh/app/install-source.json"
          [ -f "$marker" ]
          python3 -c "
          import json
          d = json.load(open('$marker'))
          assert d['channel'] == 'appdir', d
          assert d['path'] == '$HOME/.local/share/anywh/app/anywh.AppDir/AppRun', d
          "

      # The whole point of the change: the command ends with the app
      # running, not with instructions. This proves the installer starts
      # what it installed — that the real app draws a window is the e2e
      # tier's job, not this one's.
      - name: It opens the app, and a re-run doesn't open a second one
        run: |
          DISPLAY=:99 sh "$RUNNER_TEMP/alone/install.sh" --app > out.log 2>&1
          for _ in $(seq 1 20); do pgrep -x anywh > /dev/null && break; sleep 0.5; done
          pgrep -x anywh > /dev/null || { echo "::error::the installer never started the app"; exit 1; }
          DISPLAY=:99 sh "$RUNNER_TEMP/alone/install.sh" --app > rerun.log 2>&1
          cat rerun.log
          grep -q 'already running' rerun.log
          [ "$(pgrep -xc anywh)" -eq 1 ]
          pkill -x anywh || true

      - name: A re-run leaves no staging directories behind
        run: |
          mkdir -p "$HOME/.local/share/anywh/app/.staging.99999" "$HOME/.local/share/anywh/app/.unpack.99999"
          DISPLAY=:99 sh "$RUNNER_TEMP/alone/install.sh" --app --no-launch > /dev/null 2>&1
          ls -d "$HOME/.local/share/anywh/app"/.staging.* "$HOME/.local/share/anywh/app"/.unpack.* 2>/dev/null && exit 1 || true
          pkill -x anywh || true

      - name: A tampered app bundle never reaches the disk
        run: |
          rm -rf "$HOME/.local/share/anywh/app"
          echo "# tampered" >> serve/anywh-linux-x64.AppImage
          set +e
          DISPLAY=:99 sh "$RUNNER_TEMP/alone/install.sh" --app --no-launch > out.log 2>&1
          status=$?
          set -e
          cat out.log
          [ "$status" -ne 0 ]
          grep -q 'checksum mismatch for anywh-linux-x64.AppImage' out.log
          [ ! -e "$HOME/.local/share/anywh/app/anywh.AppImage" ]

  app-macos:
    name: app install (macOS, fixture bundle)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 10
    env:
      ANYWH_RELEASE_BASE_URL: http://127.0.0.1:8791
    steps:
      - uses: actions/checkout@v7

      - name: Serve a fixture app bundle
        run: |
          mkdir -p serve stage/anywh.app/Contents/MacOS
          # Same reasoning as the Linux fixture: a real binary under the
          # real name, so the running-instance check sees what it would see
          # in life.
          cp /bin/sleep stage/anywh.app/Contents/MacOS/anywh
          (cd stage && tar czf ../serve/anywh-darwin-arm64.app.tar.gz anywh.app)
          (cd serve && shasum -a 256 -- * > SHA256SUMS)
          (cd serve && python3 -m http.server 8791 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8791/SHA256SUMS > /dev/null && break; sleep 0.5; done

      # No --no-launch counterpart here: `open -a` needs a bundle with a real
      # Info.plist, which a fixture doesn't have. Placement, replacement and
      # the two refusals are what this platform's path adds over Linux, and
      # all four are exercised.
      - name: Installs the bundle into /Applications
        run: |
          ./install.sh --app --no-launch > out.log 2>&1
          cat out.log
          [ -x "/Applications/anywh.app/Contents/MacOS/anywh" ]
          grep -q 'Installed to /Applications/anywh.app' out.log
          marker="$HOME/.local/share/anywh/app/install-source.json"
          [ -f "$marker" ]
          python3 -c "
          import json
          d = json.load(open('$marker'))
          assert d['version'] == 1, d
          assert d['method'] == 'install.sh', d
          assert d['channel'] == 'app-bundle', d
          assert d['path'] == '/Applications/anywh.app/Contents/MacOS/anywh', d
          "

      - name: Refuses to replace a bundle that is running
        run: |
          /Applications/anywh.app/Contents/MacOS/anywh 120 &
          for _ in $(seq 1 20); do pgrep -x anywh > /dev/null && break; sleep 0.5; done
          set +e
          ./install.sh --app --no-launch > out.log 2>&1
          status=$?
          set -e
          cat out.log
          pkill -x anywh || true
          [ "$status" -ne 0 ]
          grep -q 'quit it and run this again' out.log
          [ -x "/Applications/anywh.app/Contents/MacOS/anywh" ]

      - name: Refuses to delete something that isn't an anywh bundle
        run: |
          rm -rf /Applications/anywh.app
          mkdir -p /Applications/anywh.app/Contents
          echo "somebody else's file" > /Applications/anywh.app/Contents/keep-me
          set +e
          ./install.sh --app --no-launch > out.log 2>&1
          status=$?
          set -e
          cat out.log
          [ "$status" -ne 0 ]
          grep -q "isn't an anywh bundle" out.log
          [ -f "/Applications/anywh.app/Contents/keep-me" ]
          rm -rf /Applications/anywh.app
