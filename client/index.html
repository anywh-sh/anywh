<!doctype html>
<!-- `lang` covers the very first frame only; LocaleProvider rewrites it with
     the resolved locale as soon as React mounts. -->
<html lang="en" data-appearance="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale`/`user-scalable=no` prevents WebKit's auto-zoom when
         focusing an input with font-size < 16px (the composer uses ~14px) —
         without it, tapping the composer on iOS zooms the whole page,
         requiring horizontal/vertical scrolling to see the rest. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>anywh.sh</title>
    <script type="module" src="/src/main.tsx" defer></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
