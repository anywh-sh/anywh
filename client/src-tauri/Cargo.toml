[package]
name = "client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Sem isso o binário sai como `client.exe` (nome do pacote Cargo) em vez de
# `anywh.exe` — tanto no instalador NSIS quanto no .exe portátil.
name = "anywh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Off by default in every normal build (`tauri dev`/`tauri build`, no flag
# needed) — opt-in only via `--features e2e` (client/tests/e2e, WebdriverIO +
# @wdio/tauri-service's embedded provider). `optional = true` below means
# neither crate even gets fetched/compiled unless this feature is on, not
# just "present but inert" — stronger than a debug_assertions gate, which
# would still pull them into every everyday `tauri dev` session.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `sync::Mutex` (tailnet_sidecar.rs, relay_setup.rs), plus `process`/`time`
# for relay_setup.rs's installer child and its polling tailer — the async
# runtime itself is already pulled in transitively by tauri/tauri-plugin-
# shell, this just makes the crate a direct dependency so those modules can
# be named.
tokio = { version = "1", features = ["sync", "process", "time"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
# Win32 access to set the window icon at the sizes the shell draws (see
# src/window_icon.rs). Same version tauri/tao already pull in, so the HWND
# type matches and nothing extra gets compiled.
# `Win32_Security` (`CreateJobObjectW` takes a `SECURITY_ATTRIBUTES`),
# `Win32_System_JobObjects` and `Win32_System_Threading` are for the sidecar
# job object (see src/tailnet_sidecar.rs), not the icon.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"

# Voz (ditado local) fora do escopo do MVP iOS (docs/22) — cpal/whisper-rs
# puxam símbolos de CoreAudio/Accelerate que não linkam no target iOS sem
# trabalho adicional. Desktop (Windows/macOS/Linux) continua com voz normal.
[target.'cfg(not(target_os = "ios"))'.dependencies]
# relay_setup.rs's address suggestion enumerates the machine's interfaces —
# the one thing std has no API for.
if-addrs = "0.15"
# updater.rs's release check. `rustls-tls` instead of the default
# (OpenSSL-backed) TLS backend: OpenSSL is the one dependency that turns
# into a cross-compile trap on the macOS-x64 and ubuntu-22.04-arm release
# legs, and this only ever talks to api.github.com, nothing that needs a
# platform-native trust store.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
cpal = "0.15"
whisper-rs = "0.16"
rubato = "0.15"
tauri-plugin-shell = "2"
# journal/62: on Windows and Linux the OS answers an `anywh://` link by
# spawning a *second* process with the URL in argv, instead of notifying the
# running one — so without this, `onOpenUrl` never fired there and only a
# cold launch could import a profile. The `deep-link` feature is what makes
# this plugin hand that argv URL to tauri-plugin-deep-link's own listeners,
# turning the two platforms into the same JS-side contract macOS already
# had. Excluded on iOS for a different reason than the voice crates above:
# the crate has no mobile target, and the behaviour it corrects (a second
# process at all) doesn't exist there.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Camada de chrome nativo (SwiftUI/Liquid Glass) do port iOS — docs/23, Fase E.
# Promovido do spike de UI nativa (docs/22, spike 2/3): manager.viewController
# + UIHostingController, com o comando real setConnectionIndicator.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-native-chrome = { path = "plugins/tauri-plugin-native-chrome" }

