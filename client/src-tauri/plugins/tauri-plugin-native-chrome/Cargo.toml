[package]
name = "tauri-plugin-native-chrome"
version = "0.1.0"
authors = [ "anywh" ]
description = "Camada de chrome nativo (SwiftUI/Liquid Glass) do port iOS do anywh — ver docs/23."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-native-chrome"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
serde_json = "1"
